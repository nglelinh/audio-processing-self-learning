# Setup
title:               "Real-Time Audio Noise Suppression: From DSP to DeepFilterNet"
description:         "Bilingual self-learning course for Vietnamese software engineers: DSP foundations through DeepFilterNet and real-time product integration (Mezon NS)."
url:                 https://nglelinh.github.io
baseurl:             '/audio-processing-self-learning'
imgurl:              https://nglelinh.github.io/audio-processing-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Real-Time Audio Noise Suppression: From DSP to DeepFilterNet"
    description: "From sampling and STFT to DeepFilterNet, on-device inference, and WebRTC/LiveKit integration — aligned with Mezon noise suppression."
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Khử nhiễu âm thanh thời gian thực: Từ DSP đến DeepFilterNet"
    description: "Từ lấy mẫu và STFT đến DeepFilterNet, suy luận trên thiết bị và tích hợp WebRTC/LiveKit — gắn với Mezon noise suppression."
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Nguyen Le Linh
  email:             nglelinh@gmail.com

# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# Custom vars
version:             0.1.0
markdown: kramdown

# Analytics
google_analytics_id: ""
